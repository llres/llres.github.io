</style></head><body><section class="auth" id="auth"><div class="auth-card"><h2>进入班级工具箱</h2><p>验证一次后，可以直接打开花名册和随机点名器。</p><label for="studentId">学号</label><input id="studentId" inputmode="numeric"><label for="password">密码</label><input id="password" type="password"><button id="login">验证并进入</button><div class="error" id="error"></div><a href="tools.html">返回工具箱</a></div></section><div id="app" class="hidden"><div class="wrap"><header class="top"><a class="brand" href="index.html">✦ 落落资源站</a><span class="page-actions"><a href="tools.html">工具箱</a><a href="javascript:history.back()">返回上一页</a></span></header><main><section class="intro"><h1>班级工具箱</h1><p id="status">验证成功，可直接使用下面的工具。</p></section><section class="grid"><a class="tool" href="class-tool.html"><span class="icon">⌘</span><h2>班级花名册</h2><p>低空2601 · 查询与管理</p></a><a class="tool" href="random-picker.html"><span class="icon">✦</span><h2>随机点名器</h2><p>按性别、寝室或自选范围随机抽取</p></a></section></main><footer class="footer">落落资源站 · 班级工具箱</footer></div></div><script>
const client=window.supabase.createClient("https://hvdtwjhdqzqnashwjcat.supabase.co","sb_publishable_pvwPJIdx17264K7UniV9HQ_bB6G6l8R"),$=id=>document.getElementById(id);
function session(){try{return JSON.parse(sessionStorage.getItem("classToolSession")||"null")}catch{return null}}
function openApp(){const s=session();if(!s)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("status").textContent=`已验证：${s.studentId} · ${s.role==="super_admin"?"超级管理员":s.role==="admin"?"管理员":"普通成员"}，可直接使用下面的工具。`}
async function login(){const studentId=$("studentId").value.trim(),password=$("password").value.trim();if(!studentId||!password){$("error").textContent="请输入学号和密码";return}const role=await client.rpc("get_class_role",{p_password:password,p_student_id:studentId});if(role.error){$("error").textContent="验证失败，请检查权限 SQL 脚本";return}if(!["member","admin","super_admin"].includes(role.data)){$("error").textContent=role.data==="no_permission"?"您没有管理权限":"学号或密码不正确";return}const roster=await client.rpc("get_class_roster",{p_password:password,p_student_id:studentId});if(roster.error||!roster.data){$("error").textContent="名单读取失败，请检查数据库连接";return}sessionStorage.setItem("classToolSession",JSON.stringify({studentId,password,role:role.data,roster:roster.data}));openApp()}$("login").onclick=login;$("password").onkeydown=e=>{if(e.key==="Enter")login()};openApp();
</script></body></html>
