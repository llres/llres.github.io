<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落落资源站</title>
<style>
:root{--bg:#0b1020;--card:#11182b;--card2:#151f36;--text:#eef3ff;--muted:#91a0bb;--line:#26334f;--accent:#6ea8ff;--accent2:#8c7cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#182a50 0,#0b1020 38%,#080c17 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.container{width:min(1100px,92%);margin:auto}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:800}.logo span{color:var(--accent)}
.nav a{color:var(--muted);text-decoration:none;margin-left:24px}.nav a:hover{color:#fff}
.hero{padding:72px 0 45px}.tag{display:inline-block;padding:7px 12px;border:1px solid #31456d;border-radius:999px;color:#bcd1ff;background:#101a30;font-size:13px}.hero h1{font-size:clamp(38px,7vw,68px);line-height:1.05;margin:18px 0 12px}.hero h1 span{background:linear-gradient(90deg,#7db2ff,#a594ff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px;max-width:680px;line-height:1.8}
.search{margin-top:28px;display:flex;gap:10px}.search input{flex:1;background:#0e1628;border:1px solid var(--line);border-radius:14px;padding:15px 18px;color:#fff;outline:none}.search input:focus{border-color:var(--accent)}button{border:0;border-radius:12px;padding:0 22px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-weight:700;cursor:pointer}
.section{padding:28px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section h2{margin:0;font-size:25px}.section-head span{color:var(--muted);font-size:14px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.filter{padding:9px 14px;background:#10182b;border:1px solid var(--line);color:var(--muted);border-radius:999px;cursor:pointer}.filter.active{color:#fff;border-color:#557ec7;background:#162544}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(180deg,#121b30,#0f1627);border:1px solid var(--line);border-radius:18px;padding:20px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#4568a3}.icon{font-size:30px}.card h3{margin:14px 0 8px}.desc{color:var(--muted);font-size:14px;line-height:1.7;min-height:47px}.meta{display:flex;gap:10px;color:#8291ac;font-size:12px;margin:15px 0}.download{display:block;text-align:center;text-decoration:none;color:#fff;background:#182642;border:1px solid #30476f;padding:11px;border-radius:11px}.download:hover{background:#22365d}
.empty{text-align:center;padding:40px;color:var(--muted);display:none}.footer{border-top:1px solid var(--line);margin-top:55px;padding:28px 0 40px;color:#74819a;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.nav a{display:none}.hero{padding-top:45px}.search{flex-direction:column}.search button{height:48px}.grid{grid-template-columns:1fr}.hero h1{font-size:42px}}
</style>
</head>
<body>
<header class="container nav">
  <div class="logo">落落<span>资源站</span></div>
  <nav><a href="#resources">资源</a><a href="#about">关于</a></nav>
</header>

<main>
<section class="container hero">
  <span class="tag">FREE · PERSONAL RESOURCE HUB</span>
  <h1>你的资源，<br><span>简单地分享。</span></h1>
  <p>一个简洁、免费的个人资源下载站。Minecraft、软件、文档和其他文件都可以放在这里。</p>
  <div class="search">
    <input id="search" placeholder="搜索资源，例如：Minecraft、整合包、软件……">
    <button onclick="doSearch()">搜索</button>
  </div>
</section>

<section class="container section" id="resources">
  <div class="section-head"><h2>资源库</h2><span id="count"></span></div>
  <div class="filters">
    <div class="filter active" data-cat="全部">全部</div>
    <div class="filter" data-cat="Minecraft">Minecraft</div>
    <div class="filter" data-cat="软件">软件</div>
    <div class="filter" data-cat="文档">文档</div>
    <div class="filter" data-cat="其他">其他</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">没有找到相关资源</div>
</section>

<section class="container section" id="about">
  <div class="card">
    <h2>关于本站</h2>
    <p class="desc">这是一个个人资源站模板。你可以把下载链接替换成自己的文件地址，再免费部署到 GitHub Pages、Cloudflare Pages 等静态托管平台。</p>
  </div>
</section>
</main>

<footer class="container footer">© 2026 落落资源站 · Personal Resource Hub</footer>

<script>
const resources=[
 {name:"Minecraft 1.20.1 乌托邦整合包",cat:"Minecraft",icon:"🎮",desc:"这里填写整合包简介、版本和安装说明。",size:"待填写",version:"1.20.1",url:"#"},
 {name:"Minecraft Mod 示例",cat:"Minecraft",icon:"🧩",desc:"这里填写 Mod 的功能介绍和适用版本。",size:"待填写",version:"1.20.1",url:"#"},
 {name:"常用工具软件",cat:"软件",icon:"🛠️",desc:"这里填写软件名称、用途和使用说明。",size:"待填写",version:"最新版",url:"#"},
 {name:"个人文档",cat:"文档",icon:"📄",desc:"这里可以放课程资料、说明文档等。",size:"待填写",version:"PDF",url:"#"},
 {name:"图片资源包",cat:"其他",icon:"🖼️",desc:"这里填写图片素材或其他资源说明。",size:"待填写",version:"资源包",url:"#"},
 {name:"新资源示例",cat:"其他",icon:"📦",desc:"复制这个对象即可继续添加资源。",size:"待填写",version:"v1.0",url:"#"}
];
let current="全部",keyword="";
function render(){
 const list=resources.filter(r=>(current==="全部"||r.cat===current)&&(`${r.name} ${r.desc} ${r.cat}`.toLowerCase().includes(keyword.toLowerCase())));
 document.getElementById("count").textContent=`共 ${list.length} 个资源`;
 document.getElementById("empty").style.display=list.length?"none":"block";
 document.getElementById("grid").innerHTML=list.map(r=>`<article class="card"><div class="icon">${r.icon}</div><h3>${r.name}</h3><div class="desc">${r.desc}</div><div class="meta"><span>${r.cat}</span><span>${r.version}</span><span>${r.size}</span></div><a class="download" href="${r.url}" target="_blank" rel="noopener">⬇ 立即下载</a></article>`).join("");
}
function doSearch(){keyword=document.getElementById("search").value.trim();render()}
document.getElementById("search").addEventListener("keydown",e=>{if(e.key==="Enter")doSearch()});
document.querySelectorAll(".filter").forEach(el=>el.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));el.classList.add("active");current=el.dataset.cat;render()});
render();
</script>
</body>
</html>
