<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>随机点名器 · 落落资源站</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(980px,94%);margin:auto}header{padding:30px 0 26px;color:#fff;background:linear-gradient(135deg,#111827,#4338ca)}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top a{color:#dbeafe;text-decoration:none;font-size:13px}.brand{font-weight:800}.page-actions{display:flex;gap:14px}.page-actions a:last-child{padding:8px 11px;border:1px solid #ffffff30;border-radius:10px;background:#ffffff12}.hero{padding:28px 0 4px}.hero h1{font-size:clamp(28px,6vw,44px);margin:0 0 8px}.hero p{color:#cbd5e1;margin:0}.panel{padding:20px;margin:18px 0;background:#fff;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 8px 24px #0f172a0b}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field label{display:block;margin-bottom:7px;color:#64748b;font-size:12px}.field select,.field input{width:100%;padding:11px 12px;border:1px solid #d9e0ea;border-radius:10px;background:#fff;color:#172033;font:inherit}.checks{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.check{display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:9px;color:#475569;font-size:13px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.button{padding:12px 17px;border:1px solid #d9e0ea;border-radius:10px;background:#fff;color:#475569;font:600 14px inherit;cursor:pointer}.button.primary{background:#312e81;color:#fff;border-color:#312e81}.button:disabled{opacity:.5;cursor:not-allowed}.hint{color:#64748b;font-size:13px;margin:13px 0 0}.result{min-height:210px;display:grid;place-items:center;padding:24px;border:1px dashed #cbd5e1;border-radius:15px;background:linear-gradient(135deg,#eef2ff,#f8fafc);text-align:center}.result.ready{border-style:solid}.result-list{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.person{min-width:130px;padding:15px 18px;border-radius:14px;background:#fff;border:1px solid #c7d2fe;box-shadow:0 8px 20px #312e8114;animation:pop .35s ease both}.person b{display:block;font-size:20px;color:#312e81}.person span{display:block;margin-top:5px;color:#64748b;font-size:12px}.empty{color:#64748b;font-size:14px}.group-tools{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin-top:15px}.group-tools .field{flex:1;min-width:180px}.auth{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#334155)}.auth-card{width:min(420px,100%);padding:28px;border-radius:23px;background:#fff;box-shadow:0 25px 80px #02061755}.auth-card h2{margin:0 0 8px}.auth-card label{display:block;margin:14px 0 7px;color:#475569;font-size:13px}.auth-card input{width:100%;padding:12px;border:1px solid #d9e0ea;border-radius:11px;font:inherit}.auth-card button{width:100%;margin-top:15px;padding:13px;border:0;border-radius:11px;background:#312e81;color:#fff;font:600 15px inherit;cursor:pointer}.auth-error{min-height:20px;margin-top:9px;color:#b91c1c;font-size:13px}.hidden{display:none!important}@keyframes pop{from{opacity:0;transform:scale(.8) translateY(8px)}to{opacity:1;transform:none}}@media(max-width:650px){.controls{grid-template-columns:1fr 1fr}.field:last-child{grid-column:1/-1}}@media(max-width:430px){.controls{grid-template-columns:1fr}.field:last-child{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.page-actions{gap:9px}.panel{padding:14px}.person{min-width:110px}}
</style></head><body>
<section class="auth" id="auth"><div class="auth-card"><h2>进入随机点名器</h2><label for="studentId">学号</label><input id="studentId" inputmode="numeric"><label for="password">密码</label><input id="password" type="password"><button id="login">进入点名器</button><div class="auth-error" id="authError"></div><a href="class-tools.html" style="display:inline-block;margin-top:14px;color:#64748b;font-size:13px">返回班级工具箱</a></div></section>
<header><div class="wrap"><div class="top"><a class="brand" href="class-tools.html">✦ 班级工具箱</a><span class="page-actions"><a href="class-tool.html">花名册</a><a href="javascript:history.back()">返回上一页</a></span></div><div class="hero"><h1>随机点名器</h1><p>从班级名单中公平、快速地抽取同学，也可以按性别、寝室或自选名单缩小范围。</p></div></div></header>
<main class="wrap"><section class="panel"><div class="controls"><div class="field"><label for="gender">抽取性别</label><select id="gender"><option value="全部">不限性别</option><option value="男">只抽男生</option><option value="女">只抽女生</option></select></div><div class="field"><label for="group">自定义分组</label><select id="group"><option value="全部">全班同学</option></select></div><div class="field"><label for="amount">抽取人数</label><input id="amount" type="number" min="1" value="1" inputmode="numeric"></div></div><div class="group-tools"><div class="field"><label for="groupName">新分组名称</label><input id="groupName" placeholder="例如：第一组"></div><button class="button" id="saveGroup">保存当前勾选为分组</button><button class="button" id="deleteGroup">删除当前分组</button></div><div class="checks" id="people"></div><div class="buttons"><button class="button primary" id="draw">开始随机抽取</button><button class="button" id="reset">重置本轮记录</button></div><p class="hint" id="hint">正在加载班级名单…</p></section><section class="panel"><div class="result" id="result"><div class="empty">准备好后点击“开始随机抽取”</div></div></section></main>
<script>
const client=window.supabase.createClient("https://hvdtwjhdqzqnashwjcat.supabase.co","sb_publishable_pvwPJIdx17264K7UniV9HQ_bB6G6l8R"),$=id=>document.getElementById(id);let roster=[],drawn=new Set(),password="",groups={};
function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){try{const session=JSON.parse(sessionStorage.getItem("classToolSession")||"null");if(session&&session.studentId&&session.password&&Array.isArray(session.roster)){password=session.password;roster=session.roster;try{groups=JSON.parse(localStorage.getItem("classPickerGroups")||"{}")}catch{}fillGroups();renderPeople();updateHint();$("auth").classList.add("hidden");return}}catch{}$("authError").textContent="请先从班级工具箱进入并完成验证。"}function fillGroups(){const names=Object.keys(groups);$("group").innerHTML='<option value="全部">全班同学</option>'+names.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("")}
function candidates(){const gender=$("gender").value,group=$("group").value,selected=[...document.querySelectorAll("#people input:checked")].map(x=>x.value),ids=group==="全部"?null:(groups[group]||[]);return roster.filter(x=>(gender==="全部"||x.gender===gender)&&(!ids||ids.includes(x.student_id))&&(!selected.length||selected.includes(x.student_id)))}
function renderPeople(){const list=roster.map(x=>`<label class="check"><input type="checkbox" value="${esc(x.student_id)}"> ${esc(x.name)}</label>`).join("");$("people").innerHTML=`<label class="check"><input id="selectAll" type="checkbox"> 全选名单</label>${list}`;$("selectAll").onchange=e=>document.querySelectorAll("#people input:not(#selectAll)").forEach(x=>x.checked=e.target.checked)}
function updateHint(){const available=candidates().filter(x=>!drawn.has(x.student_id));$("hint").textContent=`当前范围 ${candidates().length} 人，本轮还可抽取 ${available.length} 人（默认不重复）`}
function draw(){const pool=candidates().filter(x=>!drawn.has(x.student_id)),amount=Math.max(1,Math.floor(Number($("amount").value)||1));if(!pool.length){$("result").innerHTML='<div class="empty">当前范围已经抽完，请点击“重置本轮记录”。</div>';return}if(amount>pool.length){$("result").innerHTML=`<div class="empty">当前范围只有 ${pool.length} 人可抽取，请减少人数或重置本轮记录。</div>`;return}const picked=[...pool].sort(()=>Math.random()-.5).slice(0,amount);picked.forEach(x=>drawn.add(x.student_id));$("result").className="result ready";$("result").innerHTML='<div class="result-list">'+picked.map((x,i)=>`<div class="person" style="animation-delay:${i*70}ms"><b>${esc(x.name)}</b><span>${esc(x.student_id)} · ${esc(x.gender)}${x.dorm?` · ${esc(x.dorm)}`:""}</span></div>`).join("")+"</div>";updateHint()}
function reset(){drawn.clear();$("result").className="result";$("result").innerHTML='<div class="empty">准备好后点击“开始随机抽取”</div>';updateHint()}
$("gender").onchange=updateHint;$("group").onchange=updateHint;$("people").onchange=e=>{if(e.target.id!=="selectAll")updateHint()};$("saveGroup").onclick=()=>{const name=$("groupName").value.trim(),ids=[...document.querySelectorAll("#people input:checked")].filter(x=>x.id!=="selectAll").map(x=>x.value);if(!name||!ids.length){alert("请输入分组名称并勾选成员");return}groups[name]=ids;localStorage.setItem("classPickerGroups",JSON.stringify(groups));$("groupName").value="";fillGroups();$("group").value=name;updateHint()};$("deleteGroup").onclick=()=>{const name=$("group").value;if(name==="全部"){alert("请选择要删除的自定义分组");return}delete groups[name];localStorage.setItem("classPickerGroups",JSON.stringify(groups));fillGroups();updateHint()};$("draw").onclick=draw;$("reset").onclick=reset;$("login").onclick=load;$("password").onkeydown=e=>{if(e.key==="Enter")load()};load();
</script></body></html>
