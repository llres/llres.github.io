<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b1d">
<link rel="icon" href="assets/avatar.jpg" type="image/jpeg">
<link rel="stylesheet" href="site-bg.css">
<title>资源库 · 落落资源站</title>
<style>
:root{--bg:#090b1d;--line:rgba(214,202,255,.16);--text:#f8f5ff;--muted:#85819d;--panel:rgba(17,19,47,.78)}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit}.wrap{width:min(1080px,94%);margin:auto}
.head{padding:28px 0 12px}.head a{text-decoration:none;color:#aaa7c7;font-size:13px}.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.head h1{font-size:30px;margin:15px 0 0}.sub{color:var(--muted);font-size:12px;margin-top:6px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#aaa7c7;font-size:11px}.stat b{color:#f4efff;margin-right:3px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0 10px}.search{flex:1 1 260px;min-width:220px;position:relative}.search input{width:100%;padding:10px 12px 10px 35px;border:1px solid var(--line);border-radius:11px;background:#0f1129;color:#fff;outline:0;font:13px inherit}.search input:focus{border-color:#9b8cff66;box-shadow:0 0 0 3px #9b8cff12}.search span{position:absolute;left:12px;top:9px;color:#77728e}.sort{padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#0f1129;color:#c9c4dd;font:12px inherit;outline:0}.tool-btn{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#c9c4dd;cursor:pointer;font:12px inherit}.tool-btn:hover{background:#ffffff12;color:#fff}
.path{padding:8px 2px;color:#aaa5c3;font-size:12px}.path a{text-decoration:none}.path a:hover{color:#fff}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.table-head,.item{display:grid;grid-template-columns:42px minmax(0,1fr) 100px 105px 132px;gap:12px;align-items:center}.table-head{padding:10px 14px;color:#706c89;font-size:11px;border-bottom:1px solid var(--line)}.list{padding:3px}.item{padding:9px 11px;border-radius:9px;text-decoration:none;border-bottom:1px solid #ffffff0b}.item:last-child{border-bottom:0}.item:hover{background:#ffffff08}.icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:#ffffff08}.folder .icon{background:#5d78d51f}.name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type,.size{color:var(--muted);font-size:11px}.size{text-align:right}.actions{display:flex;justify-content:flex-end;gap:5px}.act{border:1px solid #ffffff12;background:#ffffff06;color:#aaa6c2;border-radius:7px;padding:5px 7px;font-size:11px;cursor:pointer}.act:hover{background:#ffffff10;color:#fff}.loading,.empty,.error{padding:42px 20px;text-align:center;color:var(--muted)}.error{color:#ffb6cb}.error button{margin-top:8px;padding:7px 11px;border:1px solid #ff9dca55;border-radius:8px;background:#ff8fcb12;color:#ffd8e9;cursor:pointer}
.dialog{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:#050511cc;backdrop-filter:blur(8px)}.dialog.show{display:flex}.viewer{width:min(900px,94vw);max-height:90vh;border:1px solid #e6dcff25;border-radius:18px;background:#11132b;box-shadow:0 25px 80px #0008;overflow:hidden;display:flex;flex-direction:column}.viewer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);gap:10px}.viewer-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{border:0;background:transparent;color:#aaa5c0;font-size:20px;cursor:pointer}.viewer-body{padding:14px;overflow:auto;display:grid;place-items:center;min-height:180px}.viewer-body img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:8px;background:#fff}.viewer-body video{max-width:100%;max-height:72vh}.viewer-body audio{width:min(680px,100%)}.viewer-body iframe{width:100%;height:72vh;border:0;background:#fff;border-radius:7px}.viewer-body .unsupported{color:var(--muted);text-align:center;line-height:1.8}.viewer-body .unsupported b{display:block;color:#eee8ff;margin-bottom:6px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:30;padding:9px 13px;border:1px solid #bda9ff35;border-radius:10px;background:#1d1b38ee;color:#f5f0ff;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.table-head{display:none}.item{grid-template-columns:36px minmax(0,1fr) 105px;padding:9px 7px}.icon{width:36px;height:36px}.type,.size{display:none}.actions{gap:4px}.act{padding:6px 7px}.head-row{align-items:flex-start;flex-direction:column}.stats{width:100%}}
@media(max-width:430px){.item{grid-template-columns:36px minmax(0,1fr) 72px}.act.preview{display:none}.actions .copy{display:none}.toolbar{margin-top:12px}.search{min-width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section class="head">
<a href="index.html">← 返回首页</a>
<div class="head-row"><div><h1>资源库</h1><div class="sub">像文件管理器一样浏览、搜索、预览和下载资源</div></div><div class="stats"><span class="stat">文件夹 <b id="folderCount">0</b></span><span class="stat">文件 <b id="fileCount">0</b></span></div></div>
</section>
<div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索当前文件夹…"></label><select id="sort" class="sort"><option value="name">按名称</option><option value="type">按类型</option><option value="size">按大小</option></select><button class="tool-btn" id="refresh">刷新</button></div>
<div class="path" id="path"></div>
<section class="panel">
<div class="table-head"><span></span><span>名称</span><span>类型</span><span style="text-align:right">大小</span><span style="text-align:right">操作</span></div>
<div class="list" id="list"><div class="loading">读取中…</div></div>
</section>
</main>
<div class="dialog" id="dialog"><div class="viewer"><div class="viewer-head"><span class="viewer-title" id="viewerTitle"></span><button class="close" id="close">×</button></div><div class="viewer-body" id="viewerBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const FC_API="https://llres-rurce-api-ubslsbzazj.cn-hangzhou.fcapp.run";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current="",cache=new Map(),items=[];
const imageExt=["jpg","jpeg","png","gif","webp","svg","bmp","avif"],videoExt=["mp4","mkv","mov","avi","webm","m4v"],audioExt=["mp3","wav","flac","m4a","aac","ogg"],pdfExt=["pdf"],archiveExt=["zip","rar","7z","tar","gz","bz2"];
function ext(x){return(x.name.split(".").pop()||"").toLowerCase()}
function size(n){if(!Number.isFinite(n))return"";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(2)+" GB"}
function type(x){if(x.type==="dir")return"文件夹";let e=ext(x);if(archiveExt.includes(e))return"压缩包";if(pdfExt.includes(e)||["doc","docx","xls","xlsx","ppt","pptx","txt","md"].includes(e))return"文档";if(imageExt.includes(e))return"图片";if(videoExt.includes(e))return"视频";if(audioExt.includes(e))return"音频";if(["exe","msi","apk","dmg"].includes(e))return"程序";return e?e.toUpperCase():"文件"}
function icon(x){if(x.type==="dir")return"📁";let t=type(x);return t==="压缩包"?"🗜️":t==="文档"?"📄":t==="图片"?"🖼️":t==="视频"?"🎬":t==="音频"?"🎵":t==="程序"?"⚙️":"📦"}
function crumbs(){const p=current.split("/").filter(Boolean);let html='<a href="#" data-path="">资源库</a>';let acc="";for(const x of p){acc=acc?acc+"/"+x:x;html+=' <span> / </span><a href="#" data-path="'+esc(acc)+'">'+esc(x)+"</a>"}$("path").innerHTML=html}
function sortItems(list){const mode=$("sort").value;return[...list].sort((a,b)=>{if(a.type!==b.type)return a.type==="dir"?-1:1;if(mode==="size")return(a.size||0)-(b.size||0);if(mode==="type")return type(a).localeCompare(type(b),"zh-CN")||a.name.localeCompare(b.name,"zh-CN");return a.name.localeCompare(b.name,"zh-CN")})}
function canPreview(x){if(x.type==="dir")return false;const e=ext(x);return imageExt.includes(e)||videoExt.includes(e)||audioExt.includes(e)||pdfExt.includes(e)}
function actionHtml(x){if(x.type==="dir")return'<span class="actions"><span class="act">进入 ›</span></span>';let p=canPreview(x)?'<button class="act preview" data-action="preview">预览</button>':"";return'<span class="actions">'+p+'<button class="act copy" data-action="copy">复制</button><button class="act" data-action="download">下载</button></span>'}
function render(){const q=$("search").value.trim().toLowerCase();const filtered=items.filter(x=>!q||x.name.toLowerCase().includes(q));$("folderCount").textContent=filtered.filter(x=>x.type==="dir").length;$("fileCount").textContent=filtered.filter(x=>x.type!=="dir").length;if(!filtered.length){$("list").innerHTML='<div class="empty">没有找到匹配内容</div>';return}$("list").innerHTML=sortItems(filtered).map(x=>{const dir=x.type==="dir";return'<div class="item '+(dir?"folder":"file")+'" data-path="'+esc(x.path)+'" data-key="'+esc(x.key||x.path)+'" data-name="'+esc(x.name)+'"><span class="icon">'+icon(x)+'</span><span class="name" title="'+esc(x.name)+'">'+esc(x.name)+'</span><span class="type">'+type(x)+'</span><span class="size">'+(dir?"":size(x.size))+'</span>'+actionHtml(x)+'</div>'}).join("")}
async function loadFC(path){const url=FC_API+"?prefix="+encodeURIComponent(path);const r=await fetch(url,{method:"GET",headers:{Accept:"application/json"}});if(!r.ok)throw Error("FC HTTP "+r.status);const data=await r.json();if(!data.success)throw Error(data.error||"FC 返回失败");return(data.items||[]).map(x=>({name:x.name,path:x.path,type:x.type==="folder"?"dir":"file",size:Number(x.size||0),key:x.key||x.path,last_modified:x.last_modified||null}))}
async function getDownloadUrl(key){const url=FC_API+"/download?key="+encodeURIComponent(key);const r=await fetch(url,{method:"GET",headers:{Accept:"application/json"}});if(!r.ok)throw Error("下载接口 HTTP "+r.status);const data=await r.json();if(!data.success||!data.download_url)throw Error(data.error||"无法生成下载链接");return data.download_url}
async function load(path=""){current=path;crumbs();$("list").innerHTML='<div class="loading">读取中…</div>';try{const key="fc:"+path;let data=cache.get(key);if(!data){data=await loadFC(path);cache.set(key,data)}items=Array.isArray(data)?data:[];$("search").value="";render()}catch(e){console.error(e);$("list").innerHTML='<div class="error">读取失败<br><button id="retry">重试</button></div>';$("retry").onclick=()=>{cache.delete("fc:"+path);load(path)}}}
function showToast(t){$("toast").textContent=t;$("toast").classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>$("toast").classList.remove("show"),1800)}
async function openViewer(x){const body=$("viewerBody"),name=x.name; $("viewerTitle").textContent=name;body.innerHTML='<div class="loading">正在获取临时链接…</div>';$("dialog").classList.add("show");try{const url=await getDownloadUrl(x.key||x.path);const e=ext(x);if(imageExt.includes(e))body.innerHTML='<img src="'+esc(url)+'" alt="'+esc(name)+'">';else if(videoExt.includes(e))body.innerHTML='<video src="'+esc(url)+'" controls autoplay></video>';else if(audioExt.includes(e))body.innerHTML='<audio src="'+esc(url)+'" controls autoplay></audio>';else if(pdfExt.includes(e))body.innerHTML='<iframe src="'+esc(url)+'"></iframe>';else body.innerHTML='<div class="unsupported"><b>暂不支持在线预览</b>这个文件可以直接下载到本地。</div>'}catch(e){body.innerHTML='<div class="unsupported"><b>预览失败</b>'+esc(e.message)+'</div>'}}
$("list").addEventListener("click",async e=>{const row=e.target.closest(".item");if(!row)return;const x=items.find(v=>v.path===row.dataset.path);if(!x)return;if(x.type==="dir"){if(e.target.closest(".actions"))return;load(x.path);return}const action=e.target.closest("[data-action]")?.dataset.action;if(action==="preview"){openViewer(x);return}if(action==="copy"){try{showToast("正在生成下载链接…");const url=await getDownloadUrl(x.key||x.path);await navigator.clipboard.writeText(url);showToast("下载链接已复制")}catch(err){console.error(err);showToast("复制失败")};return}if(action==="download"){try{showToast("正在准备下载…");const url=await getDownloadUrl(x.key||x.path);window.open(url,"_blank","noopener");showToast("下载链接已生成")}catch(err){console.error(err);showToast("下载失败")};return}if(canPreview(x))openViewer(x);else{try{const url=await getDownloadUrl(x.key||x.path);window.open(url,"_blank","noopener")}catch(err){console.error(err);showToast("下载失败")}}});
$("path").addEventListener("click",e=>{const a=e.target.closest("[data-path]");if(a){e.preventDefault();load(a.dataset.path)}});
$("search").addEventListener("input",render);$("sort").addEventListener("change",render);$("refresh").onclick=()=>{cache.delete("fc:"+current);load(current)};$("close").onclick=()=>{$("dialog").classList.remove("show");$("viewerBody").innerHTML=""};$("dialog").addEventListener("click",e=>{if(e.target.id==="dialog"){$("dialog").classList.remove("show");$("viewerBody").innerHTML=""}});document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("dialog").classList.remove("show");$("viewerBody").innerHTML=""}});
load("");
</script>
</body>
</html>
