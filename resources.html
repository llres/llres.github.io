<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b1d">
<link rel="icon" href="assets/avatar.jpg" type="image/jpeg">
<link rel="stylesheet" href="site-bg.css">
<title>资源库 · 落落资源站</title>
<style>
:root{--bg:#090b1d;--line:rgba(214,202,255,.16);--text:#f8f5ff;--muted:#85819d}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:inherit}.wrap{width:min(1000px,94%);margin:auto}
.head{padding:28px 0 14px}.head a{text-decoration:none;color:#aaa7c7;font-size:13px}.head h1{font-size:28px;margin:16px 0 0}.path{padding:10px 2px;color:#aaa5c3;font-size:12px}.path a{text-decoration:none}
.panel{border:1px solid var(--line);border-radius:14px;background:#11132f99;overflow:hidden}.table-head,.item{display:grid;grid-template-columns:42px minmax(0,1fr) 120px 100px 22px;gap:12px;align-items:center}.table-head{padding:10px 14px;color:#706c89;font-size:11px;border-bottom:1px solid var(--line)}.list{padding:3px}.item{padding:10px 11px;border-radius:9px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.045)}.item:last-child{border-bottom:0}.item:hover{background:#ffffff08}.icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:#ffffff08}.folder .icon{background:#5d78d51f}.name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type,.size{text-align:right;color:var(--muted);font-size:11px}.arrow{text-align:center;color:var(--muted);font-size:18px}.loading,.empty,.error{padding:40px 20px;text-align:center;color:var(--muted)}.error{color:#ffb6cb}.error button{margin-top:8px;padding:7px 11px;border:1px solid #ff9dca55;border-radius:8px;background:#ff8fcb12;color:#ffd8e9;cursor:pointer}
@media(max-width:650px){.table-head{display:none}.item{grid-template-columns:36px minmax(0,1fr) 20px;padding:10px 7px}.icon{width:36px;height:36px}.type,.size{display:none}}
</style>
</head>
<body>
<main class="wrap">
<section class="head">
<a href="index.html">← 返回首页</a>
<h1>资源库</h1>
</section>
<div class="path" id="path"></div>
<section class="panel">
<div class="table-head"><span></span><span>名称</span><span style="text-align:right">类型</span><span style="text-align:right">大小</span><span></span></div>
<div class="list" id="list"><div class="loading">读取中…</div></div>
</section>
</main>
<script>
const API="https://api.github.com/repos/llres/llres.github.io/contents/",BRANCH="master";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current="resources",cache=new Map();
function size(n){if(!Number.isFinite(n))return "";if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";if(n<1073741824)return(n/1048576).toFixed(1)+" MB";return(n/1073741824).toFixed(2)+" GB"}
function type(x){if(x.type==="dir")return"文件夹";let e=(x.name.split(".").pop()||"").toLowerCase();if(["zip","rar","7z","tar","gz"].includes(e))return"压缩包";if(["pdf","doc","docx","xls","xlsx","ppt","pptx","txt"].includes(e))return"文档";if(["jpg","jpeg","png","gif","webp","svg"].includes(e))return"图片";if(["mp4","mkv","mov","avi","webm"].includes(e))return"视频";if(["mp3","wav","flac","m4a"].includes(e))return"音频";if(["exe","msi","apk","dmg"].includes(e))return"程序";return e?e.toUpperCase():"文件"}
function icon(x){if(x.type==="dir")return"📁";const t=type(x);if(t==="压缩包")return"🗜️";if(t==="文档")return"📄";if(t==="图片")return"🖼️";if(t==="视频")return"🎬";if(t==="音频")return"🎵";if(t==="程序")return"⚙️";return"📦"}
function crumbs(){const p=current.split("/").filter(Boolean);let html='<a href="#" data-path="resources">资源库</a>';let acc="resources";for(const x of p.slice(1)){acc+="/"+x;html+=' <span> / </span><a href="#" data-path="'+esc(acc)+'">'+esc(x)+"</a>"}$("path").innerHTML=html}
async function load(path){current=path;crumbs();$("list").innerHTML='<div class="loading">读取中…</div>';try{let data=cache.get(path);if(!data){const r=await fetch(API+path+"?ref="+BRANCH,{headers:{Accept:"application/vnd.github+json"}});if(!r.ok)throw Error(r.status);data=await r.json();cache.set(path,data)}data.sort((a,b)=>(a.type===b.type?a.name.localeCompare(b.name,"zh-CN"):a.type==="dir"?-1:1));if(!data.length){$("list").innerHTML='<div class="empty">空文件夹</div>';return}$("list").innerHTML=data.map(x=>{const dir=x.type==="dir";return'<a class="item '+(dir?"folder":"file")+'" '+(dir?'href="#" data-path="'+esc(x.path)+'"':'href="'+esc(x.download_url||x.html_url)+'" download target="_blank" rel="noopener"')+'><span class="icon">'+icon(x)+'</span><span class="name">'+esc(x.name)+'</span><span class="type">'+type(x)+'</span><span class="size">'+(dir?"":size(x.size))+'</span><span class="arrow">'+(dir?"›":"↓")+"</span></a>"}).join("")}catch(e){$("list").innerHTML='<div class="error">读取失败<br><button id="retry">重试</button></div>';$("retry").onclick=()=>{cache.delete(path);load(path)}}}
$("path").addEventListener("click",e=>{const a=e.target.closest("[data-path]");if(a){e.preventDefault();load(a.dataset.path)}});load(current);
</script>
</body>
</html>
