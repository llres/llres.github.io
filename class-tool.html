<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>低空2601 · 班级花名册</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1080px,92%);margin:auto}
header{padding:42px 0 32px;color:#fff;background:linear-gradient(135deg,#0f172a,#334155)}h1{margin:0;font-size:clamp(28px,5vw,44px)}header p{margin:10px 0 0;color:#cbd5e1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}.stat{padding:15px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff12}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:#cbd5e1}
main{padding:24px 0 50px}.panel{padding:20px;margin-bottom:16px;background:#fff;border:1px solid #e5eaf1;border-radius:20px;box-shadow:0 10px 30px #0f172a0b}.tools{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:13px 15px;border:1px solid #d9e0ea;border-radius:13px;outline:0;font:inherit}.search:focus{border-color:#64748b;box-shadow:0 0 0 3px #64748b18}.filter{padding:11px 15px;border:1px solid #d9e0ea;border-radius:12px;background:#fff;color:#475569;font:inherit;cursor:pointer}.filter.active,.filter:hover{background:#172033;color:#fff;border-color:#172033}.hint{margin:12px 0 0;color:#64748b;font-size:13px}.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.person{padding:16px;border:1px solid #e4e9f0;border-radius:16px;background:linear-gradient(145deg,#fff,#f8fafc)}.person strong{font-size:17px}.person small{display:block;margin-top:7px;color:#64748b}.person-info{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.info{padding:6px 9px;border-radius:8px;background:#f1f5f9;color:#475569;font-size:12px}.gender{float:right;padding:4px 8px;border-radius:99px;background:#eef2ff;color:#475569;font-size:11px}.empty{text-align:center;color:#64748b;padding:35px}.auth{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#334155)}.auth-card{width:min(420px,100%);padding:28px;border-radius:24px;background:#fff;box-shadow:0 25px 80px #02061755}.auth-card h2{margin:0}.auth-card p{color:#64748b;font-size:14px;line-height:1.7}.auth-card label{display:block;margin:18px 0 7px;color:#475569;font-size:13px}.password{width:100%;padding:13px;border:1px solid #d9e0ea;border-radius:12px;font:inherit}.enter{width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:#172033;color:#fff;font:600 15px inherit;cursor:pointer}.error{min-height:20px;margin-top:10px;color:#b91c1c;font-size:13px}.site-link{display:inline-block;margin-top:18px;color:#64748b;font-size:13px}.hidden{display:none}
@media(max-width:700px){.roster{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats{gap:7px}.stat{padding:11px}.roster{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="auth" id="auth"><div class="auth-card">
<h2>低空2601 · 花名册</h2><p>请输入班级统一密码进入花名册。进入后可查询姓名、学号和性别，名单仅供班级内部使用。</p>
<label for="password">班级密码</label><input class="password" id="password" type="password" placeholder="请输入管理密码" autocomplete="current-password">
<button class="enter" id="enter">进入花名册</button><div class="error" id="error"></div><a class="site-link" href="/">返回落落资源站</a>
</div></section>
<div id="app" class="hidden">
<header><div class="wrap"><h1>低空2601 · 班级花名册</h1><p>快速查询班级成员信息</p><div class="stats"><div class="stat"><b id="total">0</b><span>班级人数</span></div><div class="stat"><b id="male">0</b><span>男生人数</span></div><div class="stat"><b id="female">0</b><span>女生人数</span></div></div></div></header>
<main class="wrap"><section class="panel"><div class="tools"><input id="search" class="search" placeholder="搜索姓名、学号、手机号或寝室"><button class="filter active" data-gender="全部">全部</button><button class="filter" data-gender="男">男生</button><button class="filter" data-gender="女">女生</button></div><p class="hint" id="result">正在加载名单…</p></section><section class="panel"><div id="roster" class="roster"></div><div id="empty" class="empty hidden">没有找到匹配的同学</div></section></main>
</div>
<script>
const client=window.supabase.createClient("https://hvdtwjhdqzqnashwjcat.supabase.co","sb_publishable_pvwPJIdx17264K7UniV9HQ_bB6G6l8R");let roster=[],gender="全部";const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
function render(){const q=$("search").value.trim().toLowerCase(),list=roster.filter(s=>(gender==="全部"||s.gender===gender)&&(!q||[s.name,s.student_id,s.phone,s.dorm].some(v=>String(v||"").toLowerCase().includes(q))));$("result").textContent=`当前显示 ${list.length} 人`;$("roster").innerHTML=list.map(s=>`<article class="person"><span class="gender">${esc(s.gender)}</span><strong>${esc(s.name)}</strong><small>学号：${esc(s.student_id)}</small><div class="person-info"><span class="info">📱 ${esc(s.phone||"手机号未登记")}</span><span class="info">🏠 ${esc(s.dorm||"寝室未登记")}</span></div></article>`).join("");$("empty").classList.toggle("hidden",list.length>0)}
async function login(){const password=$("password").value;if(!password){$("error").textContent="请输入班级密码";return}$("enter").disabled=true;$("enter").textContent="正在验证…";const {data,error}=await client.rpc("get_class_roster",{p_password:password});if(error||!data){$("error").textContent="密码不正确或花名册尚未初始化";$("enter").disabled=false;$("enter").textContent="进入花名册";return}roster=data;$("total").textContent=roster.length;$("male").textContent=roster.filter(s=>s.gender==="男").length;$("female").textContent=roster.filter(s=>s.gender==="女").length;$("auth").classList.add("hidden");$("app").classList.remove("hidden");render()}
$("enter").onclick=login;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("search").addEventListener("input",render);document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");gender=b.dataset.gender;render()});
</script>
</body>
</html>
