<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>低空2601 · 班级信息自助</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#111827,#334155);color:#fff;padding:28px 18px 24px;border-radius:0 0 26px 26px}
.wrap{max-width:980px;margin:auto;padding:0 16px}h1{margin:0;font-size:25px}.sub{opacity:.75;margin-top:7px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{background:#ffffff16;border:1px solid #ffffff1c;border-radius:15px;padding:12px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;opacity:.7}
main{padding:18px 0 40px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 5px 20px #11182708}
.search{width:100%;border:1px solid #dfe4eb;border-radius:14px;padding:13px 15px;font-size:15px;outline:none}.search:focus,input:focus,textarea:focus{border-color:#64748b;box-shadow:0 0 0 3px #64748b15}
.notice{font-size:13px;color:#64748b;line-height:1.6;margin:10px 2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-size:12px;color:#64748b;display:block;margin:2px 0 6px}input,textarea{width:100%;border:1px solid #dfe4eb;border-radius:11px;padding:11px;font:inherit;outline:none;background:#fff}textarea{min-height:80px;resize:vertical}
.fixed{background:#f5f7fb;color:#475569}.full{grid-column:1/-1}button{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:600;cursor:pointer}.primary{background:#111827;color:#fff}.light{background:#eef1f5;color:#334155}.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.student{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.name{font-size:17px;font-weight:700}.meta{font-size:12px;color:#64748b;margin-top:4px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#475569;font-size:11px;margin-left:5px}
.status{font-size:12px;margin-top:8px}.ok{color:#15803d}.empty{color:#b45309}.section-title{font-weight:700;margin-bottom:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.student{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:10px}}
 .auth{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#334155)}.auth-card{width:min(430px,100%);padding:28px;border-radius:24px;background:#fff;box-shadow:0 24px 70px #02061755}.auth-card h2{margin:0 0 8px}.auth-card p{color:#64748b;font-size:13px;line-height:1.6}.auth-card button{width:100%;margin-top:14px}.auth-error{min-height:20px;color:#b91c1c;font-size:13px;margin-top:10px}.app{display:none}.app.ready{display:block}</style></head>
<body><section class="auth" id="auth"><div class="auth-card"><h2>低空2601 · 安全进入</h2><p>请输入你的学号和班级管理密码。密码不会保存在网页源码中。</p><label for="loginId">学号</label><input id="loginId" inputmode="numeric" placeholder="请输入学号"><label for="loginPassword">管理密码</label><input id="loginPassword" type="password" placeholder="请输入管理密码"><button class="primary" id="loginButton">进入工具</button><div class="auth-error" id="authError"></div></div></section><div class="app" id="app"><header><div class="wrap"><h1>低空2601 · 班级信息自助</h1>
<div class="sub">填写自己的信息，保存后可随时修改</div>
<div class="stats"><div class="stat"><b id="total">42</b><span>班级人数</span></div><div class="stat"><b id="filled">0</b><span>已填写</span></div><div class="stat"><b id="rate">0%</b><span>完成率</span></div></div>
</div></header><main class="wrap"><div class="card"><div class="section-title">🔎 找到自己</div>
<input id="search" class="search" placeholder="输入姓名或学号，例如：李亦晨 / 1">
<div class="notice">找到本人后，点击“填写/修改”。姓名和性别由班级名单预置，寝室、手机号、备注由本人填写。</div></div>
<div id="list"></div><div class="card"><div class="section-title">📦 数据工具</div>
<div class="notice">本版本是纯静态 Git 网页，填写内容保存在当前设备浏览器中。不同手机之间不会自动同步。</div>
<div class="actions"><button class="light" onclick="exportData()">导出我的数据</button><button class="light" onclick="clearLocal()">清空本机填写记录</button></div></div></main></div>
<script>
const SUPABASE_URL="https://hvdtwjhdqzqnashwjcat.supabase.co";
const SUPABASE_KEY="sb_publishable_pvwPJIdx17264K7UniV9HQ_bB6G6l8R";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let students=[],accessPassword="",currentStudentId="";const $=id=>document.getElementById(id);
function filled(s){return [s.dorm,s.phone,s.remark].some(x=>String(x||"").trim())}function esc(v){return String(v??"").replace(/[&<>\'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\'":"&#39;","\"":"&quot;"}[c]))}
function render(){$("total").textContent=students.length;const n=students.filter(filled).length;$("filled").textContent=n;$("rate").textContent=students.length?Math.round(n/students.length*100)+"%":"0%";const q=$("search").value.trim().toLowerCase();const arr=students.filter(s=>!q||s.name.toLowerCase().includes(q)||s.student_id===q);$("list").innerHTML=arr.length?arr.map(card).join(""):"<div class=\"card\" style=\"text-align:center;color:#64748b\">没有找到对应同学</div>"}
function card(s){const ok=filled(s);return `<div class="card"><div class="student"><div><div class="name">${esc(s.name)} <span class="tag">${esc(s.gender)}</span></div><div class="meta">学号：${esc(s.student_id)} · 寝室：${esc(s.dorm||"未填写")}</div><div class="status ${ok?"ok":"empty"}">${ok?"● 已填写部分信息":"● 尚未填写"}</div></div><button class="primary" onclick="edit('${esc(s.student_id)}')">${ok?"修改信息":"填写信息"}</button></div></div>`}
async function login(){const id=$("loginId").value.trim(),password=$("loginPassword").value;if(!id||!password){$("authError").textContent="请输入学号和管理密码";return}$("loginButton").disabled=true;$("authError").textContent="正在验证…";const v=await client.rpc("verify_class_access",{p_student_id:id,p_password:password});if(v.error||!v.data){$("authError").textContent="学号或管理密码不正确";$("loginButton").disabled=false;return}accessPassword=password;currentStudentId=id;const result=await client.rpc("get_class_students",{p_password:password});if(result.error){$("authError").textContent="数据加载失败，请检查 Supabase 配置";$("loginButton").disabled=false;return}students=result.data||[];$("auth").style.display="none";$("app").classList.add("ready");render()}
function edit(id){const s=students.find(x=>x.student_id===id);if(!s)return;const box=document.createElement("div");box.style.cssText="position:fixed;inset:0;background:#0f172a66;z-index:20;display:grid;place-items:center;padding:20px";box.innerHTML=`<div class="card" style="width:min(92%,520px);margin:0"><div class="section-title">填写 / 修改个人信息</div><div class="grid"><div><label>姓名</label><input class="fixed" value="${esc(s.name)}" disabled></div><div><label>性别</label><input class="fixed" value="${esc(s.gender)}" disabled></div><div><label>寝室号</label><input id="dorm" value="${esc(s.dorm||"")}" placeholder="例如：7栋502"></div><div><label>手机号</label><input id="phone" inputmode="tel" value="${esc(s.phone||"")}" placeholder="请输入手机号"></div><div class="full"><label>备注</label><textarea id="remark">${esc(s.remark||"")}</textarea></div></div><div class="actions"><button class="light" id="cancel">取消</button><button class="primary" id="save">确定保存</button></div></div>`;document.body.appendChild(box);$("cancel").onclick=()=>box.remove();$("save").onclick=async()=>{const payload={p_password:accessPassword,p_student_id:id,p_dorm:$("dorm").value.trim(),p_phone:$("phone").value.trim(),p_remark:$("remark").value.trim()};const result=await client.rpc("update_student_info",payload);if(result.error){alert("保存失败，请稍后重试");return}Object.assign(s,{dorm:payload.p_dorm,phone:payload.p_phone,remark:payload.p_remark});box.remove();render();alert("信息已保存")}}
$("loginButton").onclick=login;$("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("search").addEventListener("input",render);function exportData(){const s=students.find(x=>x.student_id===currentStudentId);if(!s)return;const blob=new Blob([JSON.stringify(s,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=s.name+"-低空2601.json";a.click();URL.revokeObjectURL(a.href)}function clearLocal(){alert("数据保存在 Supabase 云端，不能通过清空浏览器缓存删除。如需删除请联系管理员。")}
</script></body></html>
