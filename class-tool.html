<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>低空2601 · 班级花名册</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,94%);margin:auto}header{padding:36px 0 28px;color:#fff;background:linear-gradient(135deg,#0f172a,#334155)}h1{margin:0;font-size:clamp(28px,5vw,42px)}header p{margin:9px 0 0;color:#cbd5e1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.stat{padding:14px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff12}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:#cbd5e1}main{padding:22px 0 50px}.panel{padding:18px;margin-bottom:15px;background:#fff;border:1px solid #e5eaf1;border-radius:18px;box-shadow:0 8px 24px #0f172a0b}.tools{display:flex;gap:9px;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:12px;border:1px solid #d9e0ea;border-radius:11px;font:inherit;outline:0}.filter,.action{padding:11px 14px;border:1px solid #d9e0ea;border-radius:11px;background:#fff;color:#475569;font:inherit;cursor:pointer}.filter.active,.filter:hover,.action.primary{background:#172033;color:#fff;border-color:#172033}.action.danger{color:#b91c1c;border-color:#fecaca}.hint{color:#64748b;font-size:13px}.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid #cbd5e1;background:#fff}.table{width:100%;border-collapse:collapse;min-width:760px;table-layout:fixed}.table th,.table td{padding:9px 10px;border:1px solid #d7dee8;text-align:left;font-size:13px;white-space:nowrap}.table th{color:#334155;font-weight:700;background:#e8eef6;text-align:center}.table tbody tr:nth-child(even){background:#f8fafc}.table tbody tr:hover{background:#eef6ff}.table th:nth-child(1),.table td:nth-child(1){width:130px}.table th:nth-child(2),.table td:nth-child(2){width:110px}.table th:nth-child(3),.table td:nth-child(3){width:75px}.table th:nth-child(4),.table td:nth-child(4){width:150px}.table th:nth-child(5),.table td:nth-child(5){width:110px}.table th:nth-child(6),.table td:nth-child(6){width:150px}.table input,.table select{width:100%;min-width:90px;padding:6px 7px;border:1px solid transparent;border-radius:2px;background:transparent;font:inherit}.table input:hover,.table select:hover,.table input:focus,.table select:focus{border-color:#7aa7e8;background:#fff;outline:0}.auth{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#334155)}.auth-card{width:min(420px,100%);padding:28px;border-radius:23px;background:#fff;box-shadow:0 25px 80px #02061755}.auth-card h2{margin:0}.auth-card p{color:#64748b;font-size:14px;line-height:1.7}.auth-card label{display:block;margin:15px 0 7px;color:#475569;font-size:13px}.auth-card input{width:100%;padding:12px;border:1px solid #d9e0ea;border-radius:11px;font:inherit}.enter{width:100%;margin-top:15px;padding:13px;border:0;border-radius:11px;background:#172033;color:#fff;font:600 15px inherit;cursor:pointer}.auth-actions{display:flex;gap:8px;margin-top:10px}.auth-actions button,.legacy{flex:1;padding:9px;border:1px solid #d9e0ea;border-radius:9px;background:#fff;color:#475569;cursor:pointer}.auth-card details{margin-top:15px;color:#64748b;font-size:13px}.auth-card details input{margin-top:9px}.auth-card .legacy{width:100%;margin-top:7px}.error{min-height:20px;margin-top:9px;color:#b91c1c;font-size:13px}.site-link{display:inline-block;margin-top:16px;color:#64748b;font-size:13px}.hidden{display:none}.empty{text-align:center;color:#64748b;padding:30px}@media(max-width:600px){header{padding:24px 0 20px}.stats{gap:7px}.stat{padding:10px 8px}.stat b{font-size:20px}.stat span{font-size:11px}.panel{padding:12px}.tools{display:grid;grid-template-columns:1fr 1fr}.search{grid-column:1/-1;min-width:0}.filter,.action{padding:10px 8px}.table-wrap{margin:0 -12px;padding:0 12px;border-left:0;border-right:0}.table th,.table td{padding:9px 8px}}
</style></head><body>
<section class="auth" id="auth"><div class="auth-card"><h2>班级花名册</h2><label for="studentId">学号</label><input id="studentId" inputmode="numeric"><label for="password">密码</label><input id="password" type="password"><button class="enter" id="enter">进入花名册</button><div class="error" id="error"></div><a class="site-link" href="class-tools.html">返回班级工具箱</a></div></section>
<div id="app" class="hidden"><header><div class="wrap"><h1>低空2601 · 班级花名册</h1><p id="role">只读查询</p><div class="stats"><div class="stat"><b id="total">0</b><span>班级人数</span></div><div class="stat"><b id="male">0</b><span>男生人数</span></div><div class="stat"><b id="female">0</b><span>女生人数</span></div></div></div></header><main class="wrap"><section class="panel"><div class="tools"><input id="search" class="search" placeholder="搜索姓名、学号、手机号或寝室"><button class="filter active" data-gender="全部">全部</button><button class="filter" data-gender="男">男生</button><button class="filter" data-gender="女">女生</button><button class="action primary hidden" id="add">＋ 添加人员</button></div><p class="hint" id="result"></p></section><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>手机号</th><th>寝室号</th><th class="admin-col hidden">操作</th></tr></thead><tbody id="rows"></tbody></table><div class="empty hidden" id="empty">没有找到匹配的人员</div></div></section></main></div>
<script>
const client=window.supabase.createClient("https://hvdtwjhdqzqnashwjcat.supabase.co","sb_publishable_pvwPJIdx17264K7UniV9HQ_bB6G6l8R");let roster=[],gender="全部",admin=false,pass="";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function stats(){$("total").textContent=roster.length;$("male").textContent=roster.filter(x=>x.gender==="男").length;$("female").textContent=roster.filter(x=>x.gender==="女").length}
function row(s){if(!admin)return `<tr><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td><td>${esc(s.gender)}</td><td>${esc(s.phone||"未登记")}</td><td>${esc(s.dorm||"未登记")}</td></tr>`;return `<tr data-id="${esc(s.student_id)}"><td><input data-field="student_id" value="${esc(s.student_id)}"></td><td><input data-field="name" value="${esc(s.name)}"></td><td><select data-field="gender"><option ${s.gender==="男"?"selected":""}>男</option><option ${s.gender==="女"?"selected":""}>女</option></select></td><td><input data-field="phone" value="${esc(s.phone||"")}"></td><td><input data-field="dorm" value="${esc(s.dorm||"")}"></td><td><button class="action primary save">保存</button> <button class="action danger delete">删除</button></td></tr>`}
function render(){const q=$("search").value.trim().toLowerCase(),list=roster.filter(s=>(gender==="全部"||s.gender===gender)&&(!q||[s.name,s.student_id,s.phone,s.dorm].some(v=>String(v||"").toLowerCase().includes(q))));$("result").textContent=`当前显示 ${list.length} 人`;$("rows").innerHTML=list.map(row).join("");$("empty").classList.toggle("hidden",!list.length)}
async function login(){pass=$("password").value.trim();const id=$("studentId").value.trim();if(pass!=="dk2601"&&pass!=="gl2601"){$("error").textContent="密码不正确";return}admin=pass==="gl2601";const r=await client.rpc("get_class_roster",{p_password:pass,p_student_id:id});if(r.error||!r.data){$("error").textContent="登录失败，请先执行双密码 SQL 脚本";return}roster=r.data;$("role").textContent=admin?"管理模式：可编辑、新增、删除人员":"普通成员模式：只读查询";$("add").classList.toggle("hidden",!admin);stats();$("auth").classList.add("hidden");$("app").classList.remove("hidden");render()}
function values(tr){const o={};tr.querySelectorAll("[data-field]").forEach(x=>o[x.dataset.field]=x.value.trim());return o}
async function saveRow(tr){const v=values(tr),r=await client.rpc("admin_upsert_student",{p_password:pass,p_actor_id:"26050008",p_old_student_id:tr.dataset.id,p_student_id:v.student_id,p_name:v.name,p_gender:v.gender,p_phone:v.phone,p_dorm:v.dorm});if(r.error||r.data!==true){alert("保存失败");return}location.reload()}
async function deleteRow(tr){if(!confirm("确定删除吗？"))return;const r=await client.rpc("admin_delete_student",{p_password:pass,p_actor_id:"26050008",p_student_id:tr.dataset.id});if(r.error||!r.data){alert("删除失败");return}location.reload()}
async function addRow(){const r=await client.rpc("admin_upsert_student",{p_password:pass,p_actor_id:"26050008",p_old_student_id:"",p_student_id:"新学号",p_name:"新成员",p_gender:"男",p_phone:"",p_dorm:""});if(r.error||!r.data){alert("添加失败");return}location.reload()}
$("enter").onclick=login;$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});$("search").oninput=render;$("add").onclick=addRow;$("rows").onclick=e=>{const tr=e.target.closest("tr");if(!tr)return;if(e.target.matches(".save"))saveRow(tr);if(e.target.matches(".delete"))deleteRow(tr)};document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");gender=b.dataset.gender;render()});
</script></body></html>
