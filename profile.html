<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="site-bg.css">
<title>落 · 个人介绍</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4efff;background:radial-gradient(circle at 15% 15%,#283568 0,transparent 35%),radial-gradient(circle at 85% 85%,#49254d 0,transparent 38%),#0a0b18;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{width:min(760px,90%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.top a{color:#cbd2f5;text-decoration:none;font-size:13px}.brand{font-weight:800;letter-spacing:.5px}.card{margin:7vh auto 30px;padding:42px 36px;border:1px solid rgba(232,224,255,.2);border-radius:30px;background:linear-gradient(135deg,rgba(48,52,99,.5),rgba(19,20,48,.44));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 24px 70px #05041855;backdrop-filter:blur(18px)}.avatar{width:92px;height:92px;border-radius:28px;overflow:hidden;border:3px solid #ffe8f6;box-shadow:0 0 35px #ff8ecb66}.avatar img{width:100%;height:100%;object-fit:cover}h1{margin:22px 0 8px;font-size:clamp(34px,8vw,58px)}.lead{color:#d0ccea;line-height:1.9;margin:0 0 28px}.line{height:1px;background:#d8d0ff22;margin:25px 0}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:16px;border:1px solid #e8e0ff1e;border-radius:16px;background:#ffffff08}.item b{display:block;margin-bottom:6px}.item span{color:#aaa8c9;font-size:13px;line-height:1.7}.contact-btn{display:inline-flex;margin-top:18px;padding:11px 16px;border:1px solid #e8e0ff2a;border-radius:12px;color:#f4efff;text-decoration:none;background:#ffffff0a;cursor:pointer;font:inherit;transition:.2s}.contact-btn:hover{background:#ffffff12;transform:translateY(-1px)}dialog{border:0;padding:0;background:transparent;color:#f4efff;width:min(560px,90vw)}dialog::backdrop{background:rgba(4,5,13,.72);backdrop-filter:blur(5px)}.modal{padding:25px;border:1px solid rgba(160,180,255,.22);border-radius:23px;background:linear-gradient(145deg,#202647,#101322);box-shadow:0 24px 70px #05041888}.modal .x{float:right;color:#9aa6c9;background:transparent;border:0;font-size:22px;cursor:pointer}.modal h2{margin:3px 0 8px;font-size:21px}.modal p{color:#b4bdd8;font-size:13px;line-height:1.7}.qr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:15px}.qr-card{padding:10px;border:1px solid #e8e0ff1e;border-radius:14px;background:#ffffff08;text-align:center}.qr-card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:8px}.qr-card b{display:block;font-size:12px}.qr-card span{display:block;color:#aaa8c9;font-size:11px;margin-top:4px}.mail{grid-column:1/-1;padding:12px;border:1px solid #e8e0ff1e;border-radius:14px;background:#ffffff08;text-decoration:none;color:#dff8ff;text-align:center}.back{display:inline-flex;margin-top:28px;padding:11px 15px;border:1px solid #e8e0ff2a;border-radius:12px;color:#f4efff;text-decoration:none;background:#ffffff0a}@media(max-width:520px){.card{padding:30px 22px;margin-top:4vh}.items{grid-template-columns:1fr}.qr-grid{grid-template-columns:1fr}.mail{grid-column:auto}}
</style></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html">✦ 落落资源站</a><a href="index.html">回到首站</a></header><main class="card"><div class="avatar"><img src="assets/avatar.jpg" alt="落的头像"></div><h1>你好，我是落。</h1><p class="lead">这里是我的小站，放一些正在使用、正在整理，或者觉得值得留下的东西。</p><div class="line"></div><section class="items"><div class="item"><b>正在做什么</b><span>整理资源，折腾网页，也记录一些日常想法。</span></div><div class="item"><b>这个网站</b><span>它会慢慢长大，内容不多，但每一部分都尽量实用。</span></div></section><button class="contact-btn" id="openContact" type="button">联系方式</button></main></div>
<dialog id="contactDialog"><div class="modal"><button class="x" id="closeContact" aria-label="关闭">×</button><h2>联系方式</h2><p>点击下面的方式即可联系我。</p><a class="mail" href="mailto:qq116343614qq@163.com">✉ 邮箱：qq116343614qq@163.com</a><section class="qr-grid"><div class="qr-card"><img src="assets/wechat-qr.png" alt="微信二维码"><b>微信</b><span>落与雪</span></div><div class="qr-card"><img src="assets/qq-qr.png" alt="QQ二维码"><b>QQ</b><span>扫码添加</span></div></section></div></dialog>
<script>
const dialog=document.getElementById('contactDialog'),open=document.getElementById('openContact'),close=document.getElementById('closeContact');
open.addEventListener('click',()=>dialog.showModal());
close.addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog.open)dialog.close()});
</script></body></html>
