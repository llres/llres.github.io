0px,100%);padding:28px;border-radius:23px;background:#fff;box-shadow:0 25px 80px #02061755}.auth-card h2{margin:0}.auth-card p{color:#64748b;font-size:13px;line-height:1.7}.hidden{display:none!important}.empty{text-align:center;color:#64748b;padding:30px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.panel{padding:13px}.controls{display:grid;grid-template-columns:1fr 1fr}.controls input{width:100%;grid-column:1/-1}.button{width:100%}}
</style></head><body><section class="auth" id="auth"><div class="auth-card"><h2>班级考勤</h2><p>请先从班级工具箱完成验证。考勤页面不会建立第二套登录流程。</p><a class="button primary" style="display:block;text-align:center;text-decoration:none" href="class-tools.html">返回班级工具箱</a></div></section><header><div class="wrap"><div class="top"><a class="brand" href="class-tools.html">✦ 班级工具箱</a><span class="page-actions"><a href="class-tool.html">花名册</a><a href="javascript:history.back()">返回上一页</a></span></div><div class="hero"><h1>班级考勤</h1><p>按日期登记低空2601班同学的出勤状态，并查看当天统计。</p></div></div></header><main class="wrap"><section class="panel"><div class="controls"><input id="date" type="date"><input id="search" placeholder="搜索姓名或学号"><button class="button primary" id="load">加载考勤</button><button class="button" id="markAllPresent">全部设为出勤</button><button class="button" id="save">保存考勤</button></div><div class="stats"><span class="stat">出勤 <b id="present">0</b></span><span class="stat">迟到 <b id="late">0</b></span><span class="stat">请假 <b id="leave">0</b></span><span class="stat">缺勤 <b id="absent">0</b></span></div><p class="hint" id="hint">正在读取班级名单…</p></section><section class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>学号</th><th>姓名</th><th>性别</th><th>寝室</th><th>考勤状态</th><th>备注</th></tr></thead><tbody id="rows"></tbody></table><div class="empty hidden" id="empty">没有匹配的人员</div></div></section></main><script>
let client=null;async function supabaseClient(){if(client)return client;if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}return client=window.supabase.createClient("https://hvdtwjhdqzqnashwjcat.supabase.co","sb_publishable_pvwPJIdx17264K7UniV9HQ_bB6G6l8R")}const $=id=>document.getElementById(id);let session=null,roster=[],records={};const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());$("date").value=today.toISOString().slice(0,10);
const esc=v=>String(v??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setStats(){const values=Object.values(records);$("present").textContent=values.filter(x=>x.status==="出勤").length;$("late").textContent=values.filter(x=>x.status==="迟到").length;$("leave").textContent=values.filter(x=>x.status==="请假").length;$("absent").textContent=values.filter(x=>x.status==="缺勤").length}
function render(){const q=$("search").value.trim().toLowerCase();const list=roster.filter(s=>!q||[s.name,s.student_id,s.dorm].some(v=>String(v||"").toLowerCase().includes(q)));$("rows").innerHTML=list.map(s=>{const r=records[s.student_id]||{status:"出勤",remark:""};return `<tr data-id="${esc(s.student_id)}"><td>${esc(s.student_id)}</td><td>${esc(s.name)}</td><td>${esc(s.gender)}</td><td>${esc(s.dorm||"未登记")}</td><td><select class="status"><option ${r.status==="出勤"?"selected":""}>出勤</option><option ${r.status==="迟到"?"selected":""}>迟到</option><option ${r.status==="请假"?"selected":""}>请假</option><option ${r.status==="缺勤"?"selected":""}>缺勤</option></select></td><td><input class="remark" value="${esc(r.remark||"")}" placeholder="可选"></td></tr>`}).join("");$("empty").classList.toggle("hidden",!list.length);setStats();$("hint").textContent=`当前显示 ${list.length} 人，日期：${$("date").value}`}
function readRows(){document.querySelectorAll("#rows tr").forEach(tr=>{const id=tr.dataset.id;records[id]={status:tr.querySelector(".status").value,remark:tr.querySelector(".remark").value.trim()}});setStats()}
async function loadRoster(){session=JSON.parse(sessionStorage.getItem("classToolSession")||"null");if(!session||!session.studentId||!session.password||!Array.isArray(session.roster)){return}$("auth").classList.add("hidden");roster=session.roster;await loadAttendance()}
async function loadAttendance(){const client=await supabaseClient();readRows();const r=await client.rpc("get_class_attendance",{p_password:session.password,p_student_id:session.studentId,p_date:$("date").value});if(r.error){$("hint").textContent="考勤数据读取失败：请先执行 supabase-attendance.sql";records={};render();return}records={};(r.data||[]).forEach(x=>records[x.student_id]={status:x.status,remark:x.remark||""});render()}
async function saveAttendance(){const client=await supabaseClient();readRows();const payload=roster.map(s=>({student_id:s.student_id,status:records[s.student_id]?.status||"出勤",remark:records[s.student_id]?.remark||""}));const r=await client.rpc("save_class_attendance",{p_password:session.password,p_actor_id:session.studentId,p_date:$("date").value,p_records:payload});if(r.error||r.data!==true){alert("保存失败，请确认已执行最新考勤 SQL。");return}alert("考勤已保存");await loadAttendance()}
$("load").onclick=loadAttendance;$("save").onclick=saveAttendance;$("search").oninput=render;$("date").onchange=loadAttendance;$("rows").onchange=readRows;$("markAllPresent").onclick=()=>{document.querySelectorAll("#rows .status").forEach(x=>x.value="出勤");readRows()};loadRoster();
</script></body></html>
